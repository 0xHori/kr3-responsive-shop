м, [как использовать ярлыки формы](https://dequeuniversity.com/rules/axe/4.12/form-field-multiple-labels)…","score":null,"scoreDisplayMode":"notApplicable"},"frame-title":{"id":"frame-title","title":"У элементов `\u003cframe>` и `\u003ciframe>` есть атрибут title","description":"Чтобы программы чтения с экрана могли описывать содержимое фреймов, у каждого из них должно быть название (атрибут title). Подробнее [о названиях фреймов](https://dequeuniversity.com/rules/axe/4.12/frame-title)…","score":null,"scoreDisplayMode":"notApplicable"},"heading-order":{"id":"heading-order","title":"Элементы заголовков расположены последовательно в порядке убывания","description":"Когда заголовки расположены в правильном порядке и между их уровнями нет пропусков, они образуют семантическую структуру страницы. Благодаря этому навигация с помощью технологий специальных возможностей становится проще и понятнее. Подробнее [о расположении заголовков](https://dequeuniversity.com/rules/axe/4.12/heading-order)…","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Неподходящие элементы"}],"items":[]}},"html-has-lang":{"id":"html-has-lang","title":"Элемент `\u003chtml>` содержит атрибут `[lang]`","description":"Если для страницы не указан атрибут `lang`, программа чтения с экрана предполагает, что текст приведен на языке по умолчанию, выбранном пользователем при установке программы. Если текст написан на другом языке, он может озвучиваться некорректно. Подробнее [об атрибуте `lang`](https://dequeuniversity.com/rules/axe/4.12/html-has-lang)…","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Неподходящие элементы"}],"items":[]}},"html-lang-valid":{"id":"html-lang-valid","title":"Для элемента `\u003chtml>` указано действительное значение атрибута `
